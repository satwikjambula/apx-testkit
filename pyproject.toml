[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-alpha-factory"
version = "0.1.0"
description = "Reproducible quantitative research platform"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "numpy>=2.0", "polars>=1.0", "PyYAML>=6.0", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
research-backends = ["lightgbm>=4.5", "mlflow>=2.16", "xgboost>=2.1"]
market-data = ["yfinance>=0.2.54"]
paper-trading = ["alpaca-py>=0.39"]

[project.scripts]
quant-local = "quant_factory.local_model:main"
quant-research = "quant_factory.robust_quant:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["quant_factory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quant_factory"]

[[tool.mypy.overrides]]
module = ["yaml", "sklearn.*", "lightgbm", "mlflow", "xgboost", "yfinance", "alpaca.*"]
ignore_missing_imports = true
